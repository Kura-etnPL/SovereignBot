name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "desktop/**"
      - "src/**"
      - "sidecars/**"
      - ".github/workflows/desktop-ci.yml"

permissions:
  contents: read

jobs:
  desktop-windows:
    # Windows is the shipping platform for Desktop v1.1 and is blocking.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop toolchain (locked)
        working-directory: desktop
        run: npm ci

      - name: Sync verified Core payload
        working-directory: desktop
        run: npm run sync-core

      - name: Syntax check
        working-directory: desktop
        run: npm run check

      # Unit tests import the vendored Core directly (e.g. the goal-controller
      # end-to-end over a real Core runtime), so the verified payload must exist first.
      - name: Unit tests
        working-directory: desktop
        run: npm test

      - name: Fetch pinned internal Node runtime
        working-directory: desktop
        run: npm run fetch-node

      # V4.1's deterministic Electron gate covers the product-level Jobs/Chief/Attention
      # state machine and renderer behavior that unit tests alone cannot prove: repeated
      # root-scroll invariants, waiting -> needs_attention escalation, approve/dismiss,
      # zh-CN switching, restart hydration, pump isolation, and depth/child caps.
      # It must run after fetch-node because RuntimeHost deliberately refuses host Node.
      - name: V4.1 vertical behavior gate (Jobs/Chief/Attention)
        working-directory: desktop
        run: node scripts/verify-v41-gate.mjs --quick

      # One packaging pass: forge make packages (postPackage hook flips+verifies fuses
      # before Squirrel hashes the payload) and produces the Squirrel installer.
      - name: Make Squirrel installer (win32-x64)
        working-directory: desktop
        run: npm run make

      - name: Verify Electron fuses on packaged tree
        working-directory: desktop
        run: npm run verify-fuses

      # Fake-provider contract shims: the packaged smoke and installer E2E drive the FULL
      # goal pipeline (planner/worker/reviewer/synthesizer) through provider harnesses
      # without any real API, quota, or account. Env-declared only; renderer cannot see it.
      - name: Packaged smoke (window, protocol, IPC, Core host, fake-provider goal E2E)
        working-directory: desktop
        env:
          SOVEREIGNBOT_DESKTOP_SMOKE_DATA_DIR: ${{ runner.temp }}\sb-smoke-data
          FAKE_PROVIDER_DIR: ${{ github.workspace }}\desktop\e2e\fixtures
          FAKE_PROVIDER_TRANSCRIPT: ${{ runner.temp }}\fake-provider-transcript-packaged.jsonl
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:SOVEREIGNBOT_DESKTOP_SMOKE_DATA_DIR | Out-Null
          $env:FAKE_PROVIDER_NODE = (node -p "process.execPath")
          node scripts/run-packaged-smoke.mjs

      # Installs the produced Setup.exe silently on the runner and runs the installed
      # executable in smoke mode — the shipping artifact itself must boot AND complete a
      # full fake-provider goal with trusted-cwd + no-echo + session-redaction canaries.
      - name: Installer end-to-end (silent install + fake-provider goal E2E from install dir)
        working-directory: desktop
        env:
          FAKE_PROVIDER_DIR: ${{ github.workspace }}\desktop\e2e\fixtures
          FAKE_PROVIDER_TRANSCRIPT: ${{ runner.temp }}\fake-provider-transcript-installed.jsonl
        shell: pwsh
        run: |
          $env:FAKE_PROVIDER_NODE = (node -p "process.execPath")
          node scripts/installer-e2e.mjs

      - name: Write release manifest
        working-directory: desktop
        run: npm run release-manifest

      - name: Upload release manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-manifest
          path: desktop/out/release-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Secret scan over packaged payload
        working-directory: desktop
        run: npm run secret-scan
