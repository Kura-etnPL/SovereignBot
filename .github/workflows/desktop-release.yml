name: Desktop Release

# Provenance-bound Desktop publish: triggered ONLY by pushing a desktop-v* tag that must
# equal the frozen desktop package version. The tag is built on clean Windows runners,
# driven through the full gate (unit, fuses, packaged smoke, installer E2E), and the
# workflow itself publishes the GitHub Release with artifacts + checksums + provenance
# manifest. No manual asset uploads.

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  publish-desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Require tag to match frozen desktop version
        shell: bash
        run: |
          set -euo pipefail
          expected="desktop-v$(node -p "require('./desktop/package.json').version")"
          actual="${GITHUB_REF#refs/tags/}"
          test "$actual" = "$expected" || {
            echo "Tag $actual does not match desktop version $expected" >&2
            exit 1
          }

      - name: Install desktop toolchain (locked)
        working-directory: desktop
        run: npm ci

      - name: Sync verified Core payload
        working-directory: desktop
        run: npm run sync-core

      - name: Unit tests
        working-directory: desktop
        run: npm test

      - name: Fetch pinned internal Node runtime
        working-directory: desktop
        run: npm run fetch-node

      - name: Make Squirrel installer (win32-x64)
        working-directory: desktop
        run: npm run make

      - name: Verify Electron fuses on packaged tree
        working-directory: desktop
        run: npm run verify-fuses

      - name: Packaged smoke
        working-directory: desktop
        env:
          SOVEREIGNBOT_DESKTOP_SMOKE_DATA_DIR: ${{ runner.temp }}\sb-release-smoke
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:SOVEREIGNBOT_DESKTOP_SMOKE_DATA_DIR | Out-Null
          node scripts/run-packaged-smoke.mjs

      - name: Installer end-to-end
        working-directory: desktop
        shell: pwsh
        run: node scripts/installer-e2e.mjs

      - name: Write release manifest
        working-directory: desktop
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm run release-manifest

      - name: Secret scan over packaged payload
        working-directory: desktop
        run: npm run secret-scan

      - name: Build SHA256SUMS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "desktop/out/make/squirrel.windows/x64"
          if (-not (Test-Path $dir)) { throw "missing installer dir $dir" }
          $lines = Get-ChildItem $dir -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii desktop/out/SHA256SUMS.txt
          Get-Content desktop/out/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $notes = @"
          SovereignBot Desktop $env:TAG

          Built and published by the reviewed Desktop Release workflow from commit ${{ github.sha }}.

          Provenance bindings (see release-manifest.json):
          - vendored Core manifest SHA-256 recorded at build time
          - pinned internal Node 22 runtime manifest
          - official Electron distribution zip pins enforced in forge.config.js

          Gates passed before publication: unit tests, fuse flip+verify (packaging pipeline),
          packaged smoke, silent-install end-to-end with installed-app smoke, secret scan.

          The binary is not code-signed; SmartScreen may warn. Verify SHA256SUMS.txt before running.
          "@
          $notesPath = "desktop/out/RELEASE_NOTES.md"
          Set-Content -Encoding utf8 $notesPath $notes
          gh release create "$env:TAG" --title "SovereignBot Desktop $env:TAG" --notes-file $notesPath --verify-tag `
            "desktop/out/SHA256SUMS.txt" `
            "desktop/out/release-manifest.json" `
            "desktop/out/make/squirrel.windows/x64/RELEASES" `
            "desktop/out/make/squirrel.windows/x64/*.full.nupkg" `
            "desktop/out/make/squirrel.windows/x64/SovereignBot-* Setup.exe"
