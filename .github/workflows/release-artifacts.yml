name: Build release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require tag to match package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          actual="${GITHUB_REF#refs/tags/}"
          test "$actual" = "$expected" || {
            echo "Tag $actual does not match package version $expected" >&2
            exit 1
          }
      - run: npm run check
      - run: npm test
      - run: npm run build:release
      - name: Show checksums
        shell: bash
        run: cat dist/*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: sovereignbot-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

# This workflow intentionally does not create a public GitHub Release.
# Publication remains an explicit maintainer action after artifact verification.
