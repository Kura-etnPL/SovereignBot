<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SovereignBot</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">SovereignBot</span>
      </div>
      <div id="status-chips" class="status-chips">
        <span class="chip chip-pending" id="chip-version">checking…</span>
      </div>
    </header>

    <main class="home">
      <h1>What do you want me to do?</h1>
      <p class="subtitle">Describe a goal in plain language. SovereignBot plans the work, runs governed workers, reviews results, and reports back.</p>
      <form id="goal-form" class="goal-box" autocomplete="off">
        <textarea id="goal-input" rows="3" placeholder="Example: check this project, find the most valuable fix, implement it, and review the change." disabled></textarea>
        <div class="goal-actions">
          <select id="mode-select" aria-label="Execution mode" disabled>
            <option value="auto">Auto</option>
            <option value="quick">Quick task</option>
            <option value="plan">Plan first</option>
          </select>
          <button type="submit" id="goal-submit" disabled>Run</button>
        </div>
      </form>
      <p id="foundation-note" class="note hidden">
        Foundation build — goal execution arrives with the Desktop v1.1 runtime work.
      </p>
    </main>
  </div>
  <script src="./app.js"></script>
</body>
</html>
